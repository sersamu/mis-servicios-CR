<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Servicios CR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icono-192.png">
    <link rel="icon" type="image/png" href="icono-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen pb-36">

    <nav class="bg-[#DA291C] text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center">
        <div class="flex flex-col">
            <h1 class="text-lg font-bold">Servicios CR</h1>
            <select id="selectAnio" onchange="cambiarAnioActivo()" class="bg-[#B21C14] text-white text-xs font-bold rounded px-2 py-1 outline-none mt-1 border-none shadow-inner">
                </select>
        </div>
        <button onclick="abrirModal()" class="bg-white text-[#DA291C] w-12 h-12 rounded-full shadow-xl flex items-center justify-center active:scale-90 transition-transform">
            <i class="fas fa-user-plus text-xl"></i>
        </button>
    </nav>

    <div id="lista-voluntarios" class="p-4 space-y-3">
        </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-[0_-5px_15px_rgba(0,0,0,0.1)] z-50">
        <div class="flex justify-around py-3 border-b border-gray-100">
            <button onclick="nuevoAnio()" class="flex flex-col items-center group">
                <i class="fas fa-calendar-plus text-[#DA291C] text-xl group-active:scale-90 transition-transform"></i>
                <span class="text-[10px] font-bold text-gray-500 uppercase mt-1">Nuevo Año</span>
            </button>
            <button onclick="exportarExcel()" class="flex flex-col items-center group">
                <i class="fas fa-file-excel text-green-700 text-xl group-active:scale-90 transition-transform"></i>
                <span class="text-[10px] font-bold text-gray-500 uppercase mt-1">Excel</span>
            </button>
        </div>
        <div class="flex justify-around py-3 bg-gray-50">
            <button onclick="backupDownload()" class="flex flex-col items-center group">
                <i class="fas fa-cloud-download-alt text-blue-600 text-xl group-active:scale-90 transition-transform"></i>
                <span class="text-[9px] font-bold text-gray-400 uppercase mt-1">Guardar Copia</span>
            </button>
            <button onclick="document.getElementById('fileInput').click()" class="flex flex-col items-center group">
                <i class="fas fa-cloud-upload-alt text-orange-600 text-xl group-active:scale-90 transition-transform"></i>
                <span class="text-[9px] font-bold text-gray-400 uppercase mt-1">Cargar Copia</span>
            </button>
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="backupUpload(event)">
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <h3 id="modal-titulo" class="text-xl font-bold mb-6 text-gray-800 border-b pb-2">Nuevo Voluntario</h3>
            <input type="hidden" id="edit-id">
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Nombre y Apellidos</label>
                    <input type="text" id="input-nombre" placeholder="Ej: Juan Pérez" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-[#DA291C] outline-none transition-colors">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Cargo / Rol</label>
                    <input type="text" id="input-cargo" placeholder="Ej: TES / ENFERMERO" class="w-full border-2 border-gray-100 p-3 rounded-xl focus:border-[#DA291C] outline-none transition-colors">
                </div>
            </div>
            <div class="flex justify-between items-center mt-8 pt-4">
                <button id="btn-eliminar" onclick="eliminarVoluntario()" class="text-red-500 font-bold text-sm px-2 py-2 hidden">Eliminar</button>
                <div class="flex space-x-2 ml-auto">
                    <button onclick="cerrarModal()" class="bg-gray-100 text-gray-500 px-4 py-2 rounded-xl font-bold text-sm">Cerrar</button>
                    <button onclick="guardarVoluntario()" class="bg-[#DA291C] text-white px-6 py-2 rounded-xl font-bold shadow-lg active:scale-95 transition-transform">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DB_KEY = 'cr_v3';
        
        // Carga inicial segura
        let db = { anios: [2024, 2025, 2026], anioActivo: 2026, voluntarios: [] };
        try {
            const saved = localStorage.getItem(DB_KEY);
            if(saved) {
                const parsed = JSON.parse(saved);
                if(parsed.anios && parsed.anios.length > 0) db = parsed;
            }
        } catch(e) { console.error("Error cargando DB"); }

        function save() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            render();
        }

        function render() {
            const list = document.getElementById('lista-voluntarios');
            const sel = document.getElementById('selectAnio');
            
            // Actualizar Selector de Años
            sel.innerHTML = db.anios.map(a => `<option value="${a}" ${a==db.anioActivo?'selected':''}>AÑO ${a}</option>`).join('');

            if(db.voluntarios.length === 0) {
                list.innerHTML = `<div class="text-center py-20 text-gray-300 italic"><i class="fas fa-hand-holding-heart text-6xl mb-4 opacity-20"></i><p>Pulsa el botón + para añadir voluntarios</p></div>`;
                return;
            }

            // Ordenar y mostrar lista
            const listaOrdenada = [...db.voluntarios].sort((a,b) => a.nombre.localeCompare(b.nombre));
            list.innerHTML = listaOrdenada.map(v => `
                <div class="bg-white rounded-2xl shadow-sm p-4 flex justify-between items-center border-l-[6px] border-[#DA291C] active:bg-gray-50 transition-all">
                    <div onclick="abrirModal(${v.id})" class="flex-grow">
                        <h2 class="font-bold text-gray-800 text-lg">${v.nombre}</h2>
                        <p class="text-[10px] text-gray-400 font-black uppercase tracking-
