<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Servicios CR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen pb-40">

    <nav class="bg-[#DA291C] text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold">Servicios CR</h1>
            <select id="selectAnio" onchange="cambiarAnioActivo()" class="bg-[#B21C14] text-white text-xs rounded px-2 py-1 outline-none border-none mt-1"></select>
        </div>
        <button onclick="abrirModal()" class="bg-white text-[#DA291C] w-12 h-12 rounded-full shadow-xl flex items-center justify-center">
            <i class="fas fa-plus text-xl"></i>
        </button>
    </nav>

    <div id="lista-voluntarios" class="p-4 space-y-3 text-gray-800"></div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-300 z-50">
        <div class="flex justify-around py-2 border-b">
            <button onclick="nuevoAnio()" class="flex flex-col items-center"><i class="fas fa-calendar-plus text-[#DA291C] text-lg"></i><span class="text-[9px] font-bold uppercase">Nuevo Año</span></button>
            <button onclick="exportarExcel()" class="flex flex-col items-center"><i class="fas fa-file-excel text-green-700 text-lg"></i><span class="text-[9px] font-bold uppercase">Excel</span></button>
        </div>
        <div class="flex justify-around py-2 bg-gray-50 text-[8px] font-bold text-gray-500 uppercase">
            <button onclick="backupDownload()" class="flex flex-col items-center text-blue-600"><i class="fas fa-download text-lg"></i>Copia Seguridad</button>
            <button onclick="document.getElementById('fileInput').click()" class="flex flex-col items-center text-orange-600"><i class="fas fa-upload text-lg"></i>Cargar Copia</button>
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="backupUpload(event)">
        </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-70 z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-xl w-full max-w-sm p-6">
            <h3 id="modal-titulo" class="text-xl font-bold mb-4">Nuevo Voluntario</h3>
            <input type="hidden" id="edit-id">
            <input type="text" id="input-nombre" placeholder="Nombre" class="w-full border p-3 rounded-lg mb-4 outline-none focus:border-red-500 border-gray-300">
            <input type="text" id="input-cargo" placeholder="Cargo (TES...)" class="w-full border p-3 rounded-lg mb-6 outline-none focus:border-red-500 border-gray-300">
            <div class="flex justify-between items-center">
                <button id="btn-eliminar" onclick="eliminarVoluntario()" class="text-red-500 font-bold hidden px-2">Borrar</button>
                <div class="flex space-x-2 ml-auto">
                    <button onclick="cerrarModal()" class="bg-gray-200 px-4 py-2 rounded-lg font-bold">Cerrar</button>
                    <button onclick="guardarVoluntario()" class="bg-[#DA291C] text-white px-6 py-2 rounded-lg font-bold">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DB_KEY = 'cr_vfinal';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || { anios: [2024,2025,2026], anioActivo: 2026, voluntarios: [] };

        function save() { localStorage.setItem(DB_KEY, JSON.stringify(db)); render(); }

        function render() {
            const list = document.getElementById('lista-voluntarios');
            const sel = document.getElementById('selectAnio');
            sel.innerHTML = db.anios.map(a => `<option value="${a}" ${a==db.anioActivo?'selected':''}>AÑO ${a}</option>`).join('');

            if(db.voluntarios.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-400 mt-20">Pulsa el botón + arriba para añadir voluntarios</p>`;
                return;
            }

            list.innerHTML = db.voluntarios.sort((a,b) => a.nombre.localeCompare(b.nombre)).map(v => `
                <div class="bg-white rounded-lg shadow p-4 flex justify-between items-center border-l-4 border-red-600">
                    <div onclick="abrirModal(${v.id})" class="flex-grow">
                        <h2 class="font-bold text-gray-800">${v.nombre}</h2>
                        <p class="text-[10px] text-gray-400 font-bold">${v.cargo || ''}</p>
                        <div class="text-3xl font-black text-red-600 mt-1">${v.records[db.anioActivo] || 0}</div>
                    </div>
                    <button onclick="sumarUno(${v.id})" class="bg-red-600 text-white w-14 h-14 rounded-lg flex items-center justify-center active:scale-90"><i class="fas fa-plus text-2xl"></i></button>
                </div>
            `).join('');
        }

        function sumarUno(id) {
            const v = db.voluntarios.find(x => x.id === id);
            v.records[db.anioActivo] = (v.records[db.anioActivo] || 0) + 1;
            save();
        }

        function abrirModal(id = null) {
            document.getElementById('modal').classList.remove('hidden');
            if(id) {
                const v = db.voluntarios.find(x => x.id === id);
                document.getElementById('edit-id').value = id;
                document.getElementById('input-nombre').value = v.nombre;
                document.getElementById('input-cargo').value = v.cargo;
                document.getElementById('btn-eliminar').classList.remove('hidden');
            } else {
                document.getElementById('edit-id').value = '';
                document.getElementById('input-nombre').value = '';
                document.getElementById('input-cargo').value = '';
                document.getElementById('btn-eliminar').classList.add('hidden');
            }
        }

        function cerrarModal() { document.getElementById('modal').classList.add('hidden'); }

        function guardarVoluntario() {
            const id = document.getElementById('edit-id').value;
            const n = document.getElementById('input-nombre').value.trim();
            const c = document.getElementById('input-cargo').value.trim();
            if(!n) return;

            if(id) {
                const v = db.voluntarios.find(x => x.id == id);
                v.nombre = n; v.cargo = c;
            } else {
                let recs = {}; db.anios.forEach(a => recs[a] = 0);
                db.voluntarios.push({ id: Date.now(), nombre: n, cargo: c, records: recs });
            }
            save(); cerrarModal();
        }

        function eliminarVoluntario() {
            if(confirm("¿Borrar voluntario?")) {
                db.voluntarios = db.voluntarios.filter(x => x.id != document.getElementById('edit-id').value);
                save(); cerrarModal();
            }
        }

        function cambiarAnioActivo() { db.anioActivo = parseInt(document.getElementById('selectAnio').value); save(); }

        function nuevoAnio() {
            const prox = Math.max(...db.anios) + 1;
            if(confirm("¿Añadir año " + prox + "?")) {
                db.anios.push(prox);
                db.voluntarios.forEach(v => v.records[prox] = 0);
                db.anioActivo = prox;
                save();
            }
        }

        function exportarExcel() {
            let csv = "\uFEFFVOLUNTARI@S;CARGO;" + db.anios.join(";") + "\n";
            db.voluntarios.forEach(v => {
                let fila = [v.nombre, v.cargo];
                db.anios.forEach(a => fila.push(v.records[a] || 0));
                csv += fila.join(";") + "\n";
            });
            descargar(new Blob([csv], { type: 'text/csv' }), "Servicios_CR.csv");
        }

        function backupDownload() {
            descargar(new Blob([JSON.stringify(db)], { type: 'application/json' }), "COPIA_CR.json");
        }

        function backupUpload(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                db = JSON.parse(ev.target.result); save(); alert("Copia cargada");
            };
            reader.readAsText(e.target.files[0]);
        }

        function descargar(blob, nombre) {
            const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
        }

        render();
    </script>
</body>
</html>
