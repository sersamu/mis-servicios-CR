<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Servicios CR - Nube</title>
    <link rel="apple-touch-icon" href="icono-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icono-512.png">
    <link rel="manifest" href="manifest.json?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 min-h-screen pb-32">

    <nav class="bg-[#DA291C] text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold">Servicios CR (Nube)</h1>
            <select id="selectAnio" onchange="cambiarAnioActivo()" class="bg-[#B21C14] text-white text-xs rounded px-2 py-1 border-none mt-1 outline-none font-bold shadow-inner"></select>
        </div>
        <button onclick="abrirModal()" class="bg-white text-[#DA291C] w-12 h-12 rounded-full shadow-xl flex items-center justify-center active:scale-90 transition-transform">
            <i class="fas fa-user-plus text-xl"></i>
        </button>
    </nav>

    <div id="status" class="bg-yellow-100 text-yellow-800 text-[10px] text-center py-1 font-bold">Sincronizando...</div>

    <div id="lista-voluntarios" class="p-4 space-y-3"></div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-300 z-50 flex justify-around py-4 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <button onclick="nuevoAnio()" class="flex flex-col items-center"><i class="fas fa-calendar-plus text-[#DA291C] text-xl"></i><span class="text-[9px] font-bold uppercase mt-1">Nuevo Año</span></button>
        <button onclick="exportarExcel()" class="flex flex-col items-center"><i class="fas fa-file-excel text-green-700 text-xl"></i><span class="text-[9px] font-bold uppercase mt-1">Excel</span></button>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <h3 id="modal-titulo" class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Nuevo Voluntario</h3>
            <input type="hidden" id="edit-id">
            <div class="space-y-4">
                <input type="text" id="input-nombre" placeholder="Nombre completo" class="w-full border-2 p-3 rounded-xl outline-none focus:border-[#DA291C] transition-colors">
                <input type="text" id="input-cargo" placeholder="Cargo (TES, DUE...)" class="w-full border-2 p-3 rounded-xl outline-none focus:border-[#DA291C] transition-colors">
            </div>
            <div class="flex justify-between items-center mt-8 pt-4">
                <button id="btn-eliminar" onclick="eliminarVoluntario()" class="text-red-500 font-bold text-sm px-2">Eliminar</button>
                <div class="flex space-x-2 ml-auto">
                    <button onclick="cerrarModal()" class="bg-gray-100 text-gray-500 px-4 py-2 rounded-xl font-bold">Cerrar</button>
                    <button onclick="guardarVoluntario()" class="bg-[#DA291C] text-white px-6 py-2 rounded-xl font-bold shadow-md">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /** * CONFIGURACIÓN DE FIREBASE 
         * PEGA TU URL ENTRE LAS COMILLAS (debe terminar en /)
         */
        const FIREBASE_URL = "https://servicios-cr-default-rtdb.europe-west1.firebasedatabase.app/"; 
        
        let db = { anios: [2024, 2025, 2026], anioActivo: 2026, voluntarios: {} };

        // CONECTAR CON LA NUBE
        async function fetchData() {
            try {
                const response = await fetch(FIREBASE_URL + ".json");
                const data = await response.json();
                if (data) {
                    db = data;
                    if (!db.voluntarios) db.voluntarios = {};
                    if (!db.anios) db.anios = [2024, 2025, 2026];
                }
                document.getElementById('status').innerText = "CONECTADO A LA NUBE";
                document.getElementById('status').className = "bg-green-100 text-green-800 text-[10px] text-center py-1 font-bold";
                render();
            } catch (error) {
                document.getElementById('status').innerText = "SIN CONEXIÓN (Modo Lectura)";
                document.getElementById('status').className = "bg-red-100 text-red-800 text-[10px] text-center py-1 font-bold";
            }
        }

        // GUARDAR CAMBIOS EN LA NUBE
        async function sync() {
            try {
                await fetch(FIREBASE_URL + ".json", {
                    method: 'PUT',
                    body: JSON.stringify(db)
                });
                render();
            } catch (e) { alert("Error al guardar en la nube"); }
        }

        function render() {
            const list = document.getElementById('lista-voluntarios');
            const sel = document.getElementById('selectAnio');
            sel.innerHTML = db.anios.map(a => `<option value="${a}" ${a==db.anioActivo?'selected':''}>AÑO ${a}</option>`).join('');

            const volKeys = Object.keys(db.voluntarios);
            if(volKeys.length === 0) {
                list.innerHTML = `<div class="text-center py-20 text-gray-300 italic"><i class="fas fa-cloud-upload-alt text-5xl mb-4 opacity-20"></i><p>Base de datos vacía.<br>Añade el primer voluntario.</p></div>`;
                return;
            }

            const listaArray = volKeys.map(key => ({id: key, ...db.voluntarios[key]}));
            listaArray.sort((a,b) => a.nombre.localeCompare(b.nombre));

            list.innerHTML = listaArray.map(v => `
                <div class="bg-white rounded-2xl shadow-sm p-4 flex justify-between items-center border-l-[6px] border-[#DA291C]">
                    <div onclick="abrirModal('${v.id}')" class="flex-grow">
                        <h2 class="font-bold text-gray-800 text-lg leading-tight">${v.nombre}</h2>
                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">${v.cargo || 'VOLUNTARIO'}</p>
                        <div class="mt-1 flex items-baseline">
                            <span class="text-3xl font-black text-[#DA291C]">${v.records ? (v.records[db.anioActivo] || 0) : 0}</span>
                            <span class="ml-1 text-[9px] text-gray-400 font-bold italic uppercase">Servicios</span>
                        </div>
                    </div>
                    <button onclick="sumarUno('${v.id}')" class="bg-[#DA291C] text-white w-14 h-14 rounded-2xl shadow-lg flex items-center justify-center active:scale-90 transition-transform">
                        <i class="fas fa-plus text-2xl"></i>
                    </button>
                </div>
            `).join('');
        }

        async function sumarUno(id) {
            if(!db.voluntarios[id].records) db.voluntarios[id].records = {};
            const actual = db.voluntarios[id].records[db.anioActivo] || 0;
            db.voluntarios[id].records[db.anioActivo] = actual + 1;
            if(navigator.vibrate) navigator.vibrate(50);
            await sync();
        }

        function abrirModal(id = null) {
            document.getElementById('modal').classList.remove('hidden');
            const btnEliminar = document.getElementById('btn-eliminar');
            if(id) {
                const v = db.voluntarios[id];
                document.getElementById('edit-id').value = id;
                document.getElementById('input-nombre').value = v.nombre;
                document.getElementById('input-cargo').value = v.cargo || '';
                document.getElementById('modal-titulo').innerText = "Editar Ficha";
                btnEliminar.classList.remove('hidden');
            } else {
                document.getElementById('edit-id').value = '';
                document.getElementById('input-nombre').value = '';
                document.getElementById('input-cargo').value = '';
                document.getElementById('modal-titulo').innerText = "Nuevo Voluntario";
                btnEliminar.classList.add('hidden');
            }
        }

        function cerrarModal() { document.getElementById('modal').classList.add('hidden'); }

        async function guardarVoluntario() {
            const id = document.getElementById('edit-id').value || "v" + Date.now();
            const n = document.getElementById('input-nombre').value.trim();
            const c = document.getElementById('input-cargo').value.trim();
            if(!n) return;

            if(!db.voluntarios[id]) db.voluntarios[id] = { records: {} };
            db.voluntarios[id].nombre = n;
            db.voluntarios[id].cargo = c;
            
            await sync();
            cerrarModal();
        }

        async function eliminarVoluntario() {
            const id = document.getElementById('edit-id').value;
            if(confirm("¿Eliminar de la nube para todos?")) {
                delete db.voluntarios[id];
                await sync();
                cerrarModal();
            }
        }

        function cambiarAnioActivo() {
            db.anioActivo = parseInt(document.getElementById('selectAnio').value);
            render();
        }

        async function nuevoAnio() {
            const prox = Math.max(...db.anios) + 1;
            if(confirm("¿Crear año " + prox + " para todo el equipo?")) {
                db.anios.push(prox);
                db.anioActivo = prox;
                await sync();
            }
        }

        function exportarExcel() {
            let csv = "\uFEFFVOLUNTARI@S;CARGO;" + db.anios.join(";") + "\n";
            Object.values(db.voluntarios).sort((a,b) => a.nombre.localeCompare(b.nombre)).forEach(v => {
                let fila = [v.nombre, v.cargo];
                db.anios.forEach(a => fila.push(v.records ? (v.records[a] || 0) : 0));
                csv += fila.join(";") + "\n";
            });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            a.download = "Servicios_CR_Nube.csv";
            a.click();
        }

        // Refrescar automáticamente cada 10 segundos para ver cambios de otros
        setInterval(fetchData, 10000);
        fetchData();
    </script>
</body>
</html>
